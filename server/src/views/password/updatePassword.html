<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — PharmaPrime</title>

    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e8f0fe 0%, #d4e2f7 100%);
            padding: 1.5rem;
            margin: 0;
        }

        /* ---------- Card Container ---------- */
        .reset-card {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem 2rem 2rem;
            border-radius: 32px;
            box-shadow:
                0 20px 60px rgba(26, 67, 113, 0.15),
                0 8px 24px rgba(26, 67, 113, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* subtle accent line at top */
        .reset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1a6b8a, #2d9cdb, #1a6b8a);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 0%;
            }
            50% {
                background-position: 100% 0%;
            }
        }

        /* ---------- Header ---------- */
        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1a6b8a, #2d9cdb);
            border-radius: 18px;
            color: #fff;
            font-size: 30px;
            margin-bottom: 0.75rem;
            box-shadow: 0 8px 20px rgba(26, 107, 138, 0.3);
        }

        .brand-name {
            font-size: 26px;
            font-weight: 700;
            color: #0a2a3b;
            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: #2d9cdb;
        }

        .reset-subtitle {
            font-size: 14px;
            color: #5b6f82;
            margin-top: 6px;
            font-weight: 400;
        }

        /* ---------- Form ---------- */
        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #1f3a4b;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group label i {
            color: #2d9cdb;
            font-size: 14px;
            width: 18px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 48px 14px 18px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid #e2e9f2;
            border-radius: 14px;
            background: #f8fafc;
            color: #0a2a3b;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #2d9cdb;
            box-shadow: 0 0 0 4px rgba(45, 156, 219, 0.15);
            background: #ffffff;
        }

        .input-wrapper input::placeholder {
            color: #a0b3c6;
            font-weight: 400;
            font-size: 14px;
        }

        .input-wrapper input.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.12);
        }

        .input-wrapper input.success {
            border-color: #27ae60;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.12);
        }

        /* toggle password eye */
        .toggle-password {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: #8ba0b5;
            font-size: 17px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #1a6b8a;
            background: rgba(26, 107, 138, 0.06);
        }

        .toggle-password:active {
            transform: scale(0.92);
        }

        /* ---------- Password Strength ---------- */
        .password-strength {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .strength-bar {
            display: flex;
            gap: 6px;
            height: 4px;
        }

        .strength-bar .segment {
            flex: 1;
            border-radius: 4px;
            background: #e2e9f2;
            transition: background 0.3s ease;
        }

        .strength-bar .segment.active.weak {
            background: #e74c3c;
        }
        .strength-bar .segment.active.medium {
            background: #f39c12;
        }
        .strength-bar .segment.active.strong {
            background: #27ae60;
        }

        .strength-text {
            font-size: 12px;
            font-weight: 500;
            color: #5b6f82;
            min-height: 18px;
            transition: color 0.3s;
        }

        .strength-text.weak {
            color: #e74c3c;
        }
        .strength-text.medium {
            color: #f39c12;
        }
        .strength-text.strong {
            color: #27ae60;
        }

        /* ---------- Password Requirements ---------- */
        .requirements {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-top: 2px;
            font-size: 12px;
            color: #7a8fa3;
        }

        .requirements .req {
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.25s;
        }

        .requirements .req i {
            font-size: 11px;
            color: #c0cfde;
            transition: color 0.25s;
        }

        .requirements .req.met {
            color: #27ae60;
        }

        .requirements .req.met i {
            color: #27ae60;
        }

        /* ---------- Submit Button ---------- */
        .btn-update {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a6b8a, #2d9cdb);
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.25s;
            box-shadow: 0 8px 24px rgba(26, 107, 138, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            letter-spacing: 0.3px;
            position: relative;
        }

        .btn-update:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(26, 107, 138, 0.35);
        }

        .btn-update:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-update:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-update .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-update.loading .spinner {
            display: inline-block;
        }

        .btn-update.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Footer ---------- */
        .reset-footer {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid #eaf0f6;
            text-align: center;
            font-size: 13px;
            color: #7a8fa3;
        }

        .reset-footer a {
            color: #1a6b8a;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .reset-footer a:hover {
            color: #2d9cdb;
            text-decoration: underline;
        }

        .reset-footer .heart {
            color: #e74c6f;
            display: inline-block;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
        }

        .toast {
            background: #1f2a36;
            color: #fff;
            padding: 16px 20px;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transform: translateX(120%);
            animation: slideIn 0.4s ease forwards;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid transparent;
        }

        .toast.success {
            border-left-color: #27ae60;
        }
        .toast.error {
            border-left-color: #e74c3c;
        }
        .toast.info {
            border-left-color: #2d9cdb;
        }

        .toast .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .toast .toast-content {
            flex: 1;
        }

        .toast .toast-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .toast .toast-message {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
        }

        .toast .toast-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-top: -2px;
        }

        .toast .toast-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes slideIn {
            to {
                transform: translateX(0);
            }
        }

        .toast.hide {
            animation: slideOut 0.35s ease forwards;
        }

        @keyframes slideOut {
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 520px) {
            .reset-card {
                padding: 1.75rem 1.25rem 1.5rem;
                border-radius: 24px;
            }

            .brand-name {
                font-size: 22px;
            }

            .brand-icon {
                width: 54px;
                height: 54px;
                font-size: 24px;
            }

            .input-wrapper input {
                padding: 12px 44px 12px 14px;
                font-size: 14px;
            }

            .btn-update {
                padding: 14px 20px;
                font-size: 15px;
            }

            .toast-container {
                top: 12px;
                right: 12px;
                max-width: calc(100% - 24px);
            }

            .requirements {
                font-size: 11px;
                gap: 4px 12px;
            }
        }

        @media (max-width: 380px) {
            .reset-card {
                padding: 1.25rem 1rem 1.25rem;
            }
            .reset-subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- ====== TOAST CONTAINER ====== -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- ====== MAIN CARD ====== -->
    <div class="reset-card">

        <!-- Header -->
        <div class="reset-header">
            <div class="brand-icon">
                <i class="fas fa-pills"></i>
            </div>
            <h1 class="brand-name">Pharma<span>Prime</span></h1>
            <p class="reset-subtitle">Set a new password for your account</p>
        </div>

        <!-- Form -->
        <form class="reset-form" id="resetForm" novalidate>

            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">
                    <i class="fas fa-lock"></i> New Password
                </label>
                <div class="input-wrapper">
                    <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required
                    aria-describedby="strengthText reqList"
                    />
                    <button
                    type="button"
                    class="toggle-password"
                    aria-label="Toggle password visibility"
                    data-target="newPassword"
                    >
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <!-- Strength -->
            <div class="password-strength">
                <div class="strength-bar" id="strengthBar">
                    <span class="segment" data-index="0"></span>
                    <span class="segment" data-index="1"></span>
                    <span class="segment" data-index="2"></span>
                    <span class="segment" data-index="3"></span>
                </div>
                <span class="strength-text" id="strengthText">Enter a strong password</span>
            </div>
            <!-- Requirements -->
            <div class="requirements" id="reqList">
                <span class="req" data-req="length"><i class="fas fa-circle"></i> 8+ characters</span>
                <span class="req" data-req="upper"><i class="fas fa-circle"></i> Uppercase</span>
                <span class="req" data-req="lower"><i class="fas fa-circle"></i> Lowercase</span>
                <span class="req" data-req="number"><i class="fas fa-circle"></i> Number</span>
                <span class="req" data-req="special"><i class="fas fa-circle"></i> Special</span>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">
                <i class="fas fa-check-circle"></i> Confirm Password
            </label>
            <div class="input-wrapper">
                <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
                autocomplete="new-password"
                required
                />
                <button
                type="button"
                class="toggle-password"
                aria-label="Toggle password visibility"
                data-target="confirmPassword"
                >
                <i class="fas fa-eye"></i>
            </button>
        </div>
        <div id="confirmFeedback" style="font-size:13px; min-height:20px; margin-top:2px;"></div>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn-update" id="submitBtn">
        <span class="btn-text"><i class="fas fa-sync-alt" style="margin-right:6px;"></i>Update Password</span>
        <span class="spinner"></span>
    </button>

</form>

<!-- Footer -->
<div class="reset-footer">
    Built with <span class="heart">❤</span> by
    <a href="https://www.linkedin.com/in/ritik-raj07/" target="_blank" rel="noopener noreferrer">
        Ritik Raj
    </a>
    &nbsp;·&nbsp; PharmaPrime
</div>

</div>

<!-- ====== JAVASCRIPT ====== -->
<script>
    (function() {
        'use strict';

        // ---------- DOM refs ----------
        const form = document.getElementById('resetForm');
        const newPassInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const strengthText = document.getElementById('strengthText');
        const strengthSegments = document.querySelectorAll('#strengthBar .segment');
        const reqItems = document.querySelectorAll('.requirements .req');
        const confirmFeedback = document.getElementById('confirmFeedback');
        const toastContainer = document.getElementById('toastContainer');

        // ---------- Config ----------
        // In production, set this to your actual server URL.
        // For local dev, you can use a relative path or env var.
        // The page will read from a global or use a fallback.
        // Dynamically get the base URL from the browser's address bar
        const BASE_ORIGIN = window.location.origin; // e.g., "https://app.pharmaprime.com"

        // If your API lives on the same origin but under /api
        const SERVER_URL = BASE_ORIGIN; 
        
        
        // ---------- Helpers ----------
        function getTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        // ---------- Toast system ----------
        function showToast(message, type = 'info', title = '') {
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                info: 'fas fa-info-circle'
            };
            const colors = {
                success: '#27ae60',
                error: '#e74c3c',
                info: '#2d9cdb'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.style.borderLeftColor = colors[type] || colors.info;

            toast.innerHTML = `
              <div class="toast-icon" style="color:${colors[type] || colors.info}">
                <i class="${icons[type] || icons.info}"></i>
              </div>
              <div class="toast-content">
                <div class="toast-title">${title || (type === 'success' ? 'Success' : type === 'error' ? 'Error' : 'Info')}</div>
                <div class="toast-message">${message}</div>
              </div>
              <button class="toast-close" aria-label="Dismiss notification">
                <i class="fas fa-times"></i>
              </button>
            `;

            toastContainer.appendChild(toast);

            // auto-remove after 5s
            const autoDismiss = setTimeout(() => {
                dismissToast(toast);
            }, 5500);

            // close button
            toast.querySelector('.toast-close').addEventListener('click', () => {
                clearTimeout(autoDismiss);
                dismissToast(toast);
            });

            // dismiss on click outside? no, only explicit.
            return toast;
        }

        function dismissToast(toast) {
            if (toast.classList.contains('hide')) return;
            toast.classList.add('hide');
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 380);
        }

        // ---------- Password strength & validation ----------
        function evaluatePassword(password) {
            const checks = {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                number: /\d/.test(password),
                special: /[^A-Za-z0-9]/.test(password),
            };
            const score = Object.values(checks).filter(Boolean).length;
            let level = 'weak';
            let label = 'Weak — try adding more variety';
            if (score >= 5) { level = 'strong';
                label = 'Strong — great password!'; } else if (score >= 3) { level = 'medium';
                label = 'Medium — add more character types'; } else if (score >= 1) { level = 'weak';
                label = 'Weak — use 8+ chars with upper, lower, number & special'; } else { level = 'weak';
                label = 'Enter a stronger password'; }

            return { checks, score, level, label };
        }

        function updateStrengthUI(password) {
            const result = evaluatePassword(password);
            const score = result.score;
            const level = result.level;

            // segments
            strengthSegments.forEach((seg, i) => {
                seg.className = 'segment';
                if (i < score) {
                    seg.classList.add('active', level);
                }
            });

            // text
            strengthText.textContent = password.length === 0 ? 'Enter a strong password' : result.label;
            strengthText.className = 'strength-text';
            if (password.length > 0) {
                strengthText.classList.add(level);
            }

            // requirements
            reqItems.forEach((item) => {
                const key = item.dataset.req;
                const met = result.checks[key] || false;
                item.classList.toggle('met', met);
                const icon = item.querySelector('i');
                if (icon) {
                    icon.className = met ? 'fas fa-check-circle' : 'fas fa-circle';
                }
            });

            return result;
        }

        function validateMatch() {
            const newVal = newPassInput.value;
            const confirmVal = confirmPassInput.value;
            if (confirmVal.length === 0) {
                confirmFeedback.textContent = '';
                confirmFeedback.style.color = '';
                return true;
            }
            if (newVal === confirmVal) {
                confirmFeedback.textContent = '✓ Passwords match';
                confirmFeedback.style.color = '#27ae60';
                return true;
            } else {
                confirmFeedback.textContent = '✗ Passwords do not match';
                confirmFeedback.style.color = '#e74c3c';
                return false;
            }
        }

        // ---------- Real-time UI updates ----------
        newPassInput.addEventListener('input', function() {
            updateStrengthUI(this.value);
            if (confirmPassInput.value.length > 0) {
                validateMatch();
            }
            // clear field error states
            this.classList.remove('error', 'success');
        });

        confirmPassInput.addEventListener('input', function() {
            validateMatch();
            this.classList.remove('error', 'success');
        });

        // ---------- Toggle password visibility ----------
        document.querySelectorAll('.toggle-password').forEach((btn) => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                const icon = this.querySelector('i');
                if (icon) {
                    icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
                }
                input.focus();
            });
        });

        // ---------- Form submission ----------
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. Validate
            const newPass = newPassInput.value.trim();
            const confirmPass = confirmPassInput.value.trim();

            // basic presence
            if (!newPass || !confirmPass) {
                showToast('Please fill in both password fields.', 'error', 'Missing Fields');
                if (!newPass) newPassInput.focus();
                else confirmPassInput.focus();
                return;
            }

            // password strength
            const strength = evaluatePassword(newPass);
            if (strength.score < 3) {
                showToast('Please choose a stronger password (at least 3 requirements met).', 'error', 'Weak Password');
                newPassInput.focus();
                return;
            }

            // match
            if (newPass !== confirmPass) {
                showToast('Passwords do not match. Please re-enter.', 'error', 'Mismatch');
                confirmPassInput.focus();
                return;
            }

            // 2. Get token
            const token = getTokenFromURL();
            if (!token) {
                showToast('Missing reset token. Please use the link from your email.', 'error', 'Invalid Link');
                return;
            }

            // 3. Prepare request
            const url = `${SERVER_URL}/api/employee/update-password`;

            const payload = {
                newPassword: newPass,
                confirmPassword: confirmPass,
            };

            // 4. UI loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            try {
                const response = await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify(payload),
                });

                // Parse response (even if error)
                let data;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = { message: response.statusText || 'Something went wrong.' };
                }

                if (response.ok) {
                    showToast(
                        data.message || 'Your password has been updated successfully. You can now log in.',
                        'success',
                        'Password Updated'
                    );
                    // Optionally clear form
                    form.reset();
                    updateStrengthUI('');
                    confirmFeedback.textContent = '';
                    strengthSegments.forEach(s => s.className = 'segment');
                    strengthText.textContent = 'Enter a strong password';
                    strengthText.className = 'strength-text';
                    reqItems.forEach(r => r.classList.remove('met'));
                } else {
                    const errMsg = data.message || data.error || `Server error (${response.status})`;
                    showToast(errMsg, 'error', 'Update Failed');
                }
            } catch (err) {
                console.error('Reset password error:', err);
                showToast(
                    'Unable to connect to the server. Please check your network and try again.',
                    'error',
                    'Connection Error'
                );
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        // ---------- Init: check token on load ----------
        (function init() {
            const token = getTokenFromURL();
            if (!token) {
                // Not a critical error, just inform the user.
                // But we can show a subtle toast.
                setTimeout(() => {
                    showToast(
                        'No reset token found in the URL. Please use the link from your email.',
                        'info',
                        'Token Missing'
                    );
                }, 600);
            }
        })();

        // ---------- (Optional) expose server URL override via console ----------
        // So devs can set window.SERVER_URL = 'http://localhost:3000' etc.
        console.log('PharmaPrime Reset — SERVER_URL:', SERVER_URL);
        console.log('To override: window.SERVER_URL = "http://your-api.com"');

    })();
</script>
